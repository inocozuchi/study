# main にマージ（push）されるたびにビルドして GitHub Pages へ公開する。
# 初回だけ、リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしておく。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Service Worker のキャッシュ名に公開ごとの番号を付ける（更新が確実に届き、古いアセットが消える）
      - run: sed -i "s/const VERSION = 'focus-trail-v\([0-9]*\)'/const VERSION = 'focus-trail-v\1-${GITHUB_RUN_NUMBER}'/" dist/sw.js && grep -n "const VERSION" dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
