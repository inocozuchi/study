<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 全画面：viewport-fit=cover + black-translucent でシーンを時刻の帯の下まで広げる（上に帯を作らない）。
         文字やボタンは pt-safe（env(safe-area-inset-top)）で時刻の下へ。時刻の帯の下に何を敷くかは画面ごと（lib/chrome.ts）。
         ホーム画面アプリでは iOS が高さを時刻の帯の分だけ短く渡すことがある（WebKit 301108）。
         index.css の @media (display-mode: standalone) で html を画面の高さまで伸ばして、画面いっぱいの高さを受け取る。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Focus Trail</title>
    <meta name="description" content="集中は山を登る旅。休憩は焚き火のそばで。学習・集中記録アプリ Focus Trail" />
    <!-- theme-color は置かない：iOS 26 のホーム画面アプリでは theme-color があると時刻の帯をその色で塗り、
         black-translucent でも画面が時刻の帯の下から始まる（上に色の帯ができる）。シーンを時刻・ダイナミックアイランドの裏まで描くため -->
    <meta name="color-scheme" content="light" />
    <!-- 外観（ライト／ダーク）を最初に決める。本体の読み込みを待つと、暗い設定でも一瞬白く光る -->
    <script>
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('focus-trail:v1:appearance') || 'system'; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>

    <!-- ホーム画面に追加したときの設定（iOS / Android） -->

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Focus Trail" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 起動画面は置かない（開いたらすぐ操作できるように）。地の色だけ先に塗り、白い一瞬を作らない -->
